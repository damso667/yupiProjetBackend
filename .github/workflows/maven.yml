name: Java CI with Maven & Deploy to Render

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      - name: Build with Maven
        run: mvn -B package --file pom.xml
        env:
          # Remplacez ces clés par vos variables réelles ou par des Secrets GitHub
          SPRING_DATASOURCE_URL: ${{ secrets.AIVEN_SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.AIVEN_SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.AIVEN_SPRING_DATASOURCE_PASSWORD }}