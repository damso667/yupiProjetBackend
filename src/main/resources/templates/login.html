<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - YupiProjet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900">

<section>
    <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">

        <div class="flex items-center mb-6 text-2xl font-semibold text-gray-900 dark:text-white">
            YupiProjet
        </div>

        <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
            <div class="p-6 space-y-4 md:space-y-6 sm:p-8">

                <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                    Connexion à votre compte
                </h1>

                <!-- Zone d'affichage des erreurs, cachée par défaut -->
                <div id="erreurLogin" class="hidden p-3 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
                    Email ou mot de passe incorrect.
                </div>

                <!-- Pas de th:action ni method="post" classique : soumission gérée en JS -->
                <form id="formLogin" class="space-y-4 md:space-y-6">
                    <div>
                        <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                        <input type="email" name="email" id="email"
                               class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                               placeholder="nom@yupi.com" required>
                    </div>
                    <div>
                        <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Mot de passe</label>
                        <input type="password" name="password" id="password" placeholder="••••••••"
                               class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                               required>
                    </div>

                    <button type="submit" id="btnLogin"
                            class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                        Se connecter
                    </button>

                    <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                        Pas encore de compte ? <a href="/register" class="font-medium text-blue-600 hover:underline dark:text-blue-500">S'inscrire</a>
                    </p>
                </form>

            </div>
        </div>
    </div>
</section>

<script>
    document.getElementById('formLogin').addEventListener('submit', async function (e) {
        e.preventDefault(); // empêche le rechargement classique de la page

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const erreurDiv = document.getElementById('erreurLogin');
        const btn = document.getElementById('btnLogin');

        erreurDiv.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Connexion...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include', // ESSENTIEL : garde le cookie de session JSESSIONID
                body: JSON.stringify({ email: email, password: password })
            });

            if (response.ok) {
                // Connexion réussie -> redirection vers le dashboard Thymeleaf
                window.location.href = '/dashboard';
            } else {
                erreurDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        } catch (err) {
            erreurDiv.textContent = 'Erreur de connexion au serveur.';
            erreurDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Se connecter';
        }
    });
</script>

</body>
</html>
